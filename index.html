<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#74482A"><meta name="robots" content="noindex,nofollow"></head><body><!--LCT-START--><title>LCT Projektmappe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>[hidden]{display:none!important}
/* Projektmappe: Werkstatt-Akte – ruhiges Papier, Leder-Braun, Serifen-Überschriften, Tabellen wie Formulare */
:root{
  --bg:#F4EFE7; --surface:#FFFCF7; --surface2:#EEE5D7; --ink:#2A1F17; --muted:#76624F; --line:#DFD2BF; --line2:#CDBBA2;
  --accent:#74482A; --accent-ink:#FFFFFF; --accent-soft:#E9DAC6; --focus:#A9733F;
  --ok:#4C7342; --ok-soft:#DDE8D6; --warn:#9A6A12; --warn-soft:#F3E4C4; --bad:#9B3F2A; --bad-soft:#F2D9D0; --mute-soft:#E7E1D8;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",Menlo,monospace;
  --r:6px; --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1612; --surface:#241D17; --surface2:#2E251E; --ink:#EEE4D7; --muted:#B19D89; --line:#3A2F27; --line2:#4A3C31;
  --accent:#C9996A; --accent-ink:#1B1612; --accent-soft:#3A2B20; --focus:#D9A877;
  --ok:#93B886; --ok-soft:#24301F; --warn:#DDB35E; --warn-soft:#3A2F17; --bad:#E08A70; --bad-soft:#3B221B; --mute-soft:#2C2620;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1612; --surface:#241D17; --surface2:#2E251E; --ink:#EEE4D7; --muted:#B19D89; --line:#3A2F27; --line2:#4A3C31;
  --accent:#C9996A; --accent-ink:#1B1612; --accent-soft:#3A2B20; --focus:#D9A877;
  --ok:#93B886; --ok-soft:#24301F; --warn:#DDB35E; --warn-soft:#3A2F17; --bad:#E08A70; --bad-soft:#3B221B; --mute-soft:#2C2620;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:58px;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;line-height:1.1;text-decoration:none;color:var(--ink);flex:0 0 auto}
.brand b{font:600 18px/1.1 var(--serif);letter-spacing:.01em}
.brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
nav.menu{display:flex;gap:2px;flex:1 1 auto;min-width:0}
.mi{position:relative}
.mi>.mb{text-decoration:none;background:none;border:0;padding:8px 11px;border-radius:var(--r);cursor:pointer;color:var(--ink);font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.mi>.mb:hover,.mi:hover>.mb,.mi:focus-within>.mb{background:var(--surface2)}
.mi>.mb.cur{color:var(--accent);font-weight:600}
.mi>.mb svg{width:10px;height:10px;opacity:.6}
.dd{position:absolute;top:calc(100% + 6px);left:0;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:none;z-index:40}
.mi:hover .dd,.mi:focus-within .dd{display:block}
.mi .dd::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}
.dd a.ddall{font-weight:600;border-bottom:1px solid var(--line);border-radius:5px 5px 0 0;margin-bottom:4px}
.dd a{display:block;padding:8px 10px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:14px}
.dd a:hover,.dd a:focus-visible{background:var(--surface2)}
.dd a.cur{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.msel{display:none;flex:1 1 auto;min-width:0}
.msel select{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface)}
.savebox{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.savestate{font-size:12.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.dirty{background:var(--warn)} .dot.err{background:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:4px}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
@media (max-width:1420px){.savestate span.lbl{display:none}}
@media (max-width:1180px){nav.menu{display:none}.msel{display:block}}
@media (max-width:700px){.brand small{display:none}}
@media (max-width:520px){.top-in{gap:8px}.brand{display:none}.savebox{gap:4px}.savebox .btn .lbl{display:none}.savebox .btn{padding:7px 9px}}

/* Seite */
main{max-width:1280px;margin:0 auto;padding-block:26px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner{background:var(--warn-soft);border:1px solid var(--line2);border-radius:8px;padding:12px 14px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 280px}
.crumb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1.pt{font:600 30px/1.15 var(--serif);margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 22px;max-width:75ch}
h2.sec{font:600 20px/1.2 var(--serif);margin:34px 0 10px;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.panel h3{font:600 17px/1.2 var(--serif);margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.muted{color:var(--muted)} .small{font-size:13px}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
a.kpi:hover{border-color:var(--line2)}
.kpi .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{font:600 26px/1.1 var(--serif)}
.kpi b small{font:400 14px var(--sans);color:var(--muted)}
.kpi .s{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.ok i{background:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--mute-soft);color:var(--muted);white-space:nowrap;line-height:1.6}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.statusline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}

/* Zeitskala */
.gantt{position:relative;min-width:0}
.g-head,.g-row{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:12px;align-items:center}
.g-head{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.g-months{position:relative;height:18px}
.g-months span{position:absolute;top:0;transform:translateX(2px);white-space:nowrap}
.g-row{padding:5px 0;border-top:1px solid var(--line)}
.g-name{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-name small{display:block;color:var(--muted);font-size:11.5px}
.g-track{position:relative;height:22px;border-radius:3px}
.g-m{position:absolute;top:-5px;bottom:-5px;width:1px;background:var(--line)}
.g-bar{position:absolute;top:3px;bottom:3px;background:var(--accent-soft);border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.g-bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.85}
.g-bar.late{border-color:var(--warn)}
.g-today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad);z-index:2;pointer-events:none}
.g-today b{position:absolute;top:-16px;left:4px;font:600 10.5px var(--sans);color:var(--bad);white-space:nowrap}
.g-wrap{overflow-x:auto}
.g-inner{min-width:620px;padding-top:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* Tabellen */
.tbl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tbl-tools input[type=search],.tbl-tools select{padding:6px 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);min-width:0}
.tbl-tools input[type=search]{flex:1 1 200px;max-width:320px}
.tbl-tools .cnt{font-size:13px;color:var(--muted);margin-left:auto}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:72vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
table.t th{position:sticky;top:0;z-index:2;background:var(--surface2);text-align:left;font-weight:600;font-size:12.5px;color:var(--ink);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
table.t th.nosort{cursor:default}
table.t th .ar{color:var(--muted);font-size:10px;margin-left:4px}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:0}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:color-mix(in srgb,var(--surface2) 45%,transparent)}
table.t td.ed{cursor:text}
table.t td.n{text-align:right;white-space:nowrap}
table.t td .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
table.t td.empty::after{content:"–";color:var(--line2)}
table.t tr.done td:not(.ck):not(.act){color:var(--muted)}
table.t tr.done td.nm{text-decoration:line-through;text-decoration-color:var(--line2)}
table.t td.ck,table.t th.ck{width:38px;text-align:center;cursor:default}
table.t td.act{width:40px;white-space:nowrap;text-align:right}
table.t tfoot td{position:sticky;bottom:0;background:var(--surface2);font-weight:600;border-top:1px solid var(--line2)}
table.t input.ce,table.t select.ce,table.t textarea.ce{width:100%;min-width:90px;padding:4px 6px;border:1px solid var(--focus);border-radius:4px;background:var(--surface)}
table.t textarea.ce{min-height:90px;resize:vertical}
.chk{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid var(--line2);border-radius:4px;background:var(--surface);cursor:pointer;display:inline-grid;place-content:center;vertical-align:middle;margin:0}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chk:disabled{cursor:default;opacity:.6}
a.lk{white-space:nowrap;text-decoration:none;font-weight:500}
a.lk:hover{text-decoration:underline}
.confirm{color:var(--bad);font-size:12.5px;white-space:nowrap}

/* Texteditor */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.tb{display:flex;flex-wrap:wrap;gap:2px;padding:6px;border-bottom:1px solid var(--line);background:var(--surface2);border-radius:10px 10px 0 0;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:5}
.tb button{border:0;background:none;padding:5px 9px;border-radius:4px;cursor:pointer;font-size:13.5px;color:var(--ink);min-width:32px}
.tb button:hover{background:var(--surface)}
.tb .sep{width:1px;background:var(--line2);margin:4px 4px}
.tb .meta{margin-left:auto;font-size:12px;color:var(--muted);align-self:center;padding-right:6px}
.linkbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line)}
.linkbar input{flex:1;padding:6px 8px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface)}
.ed-area{padding:18px 22px 22px;min-height:160px;outline:none;max-width:none}
.prose{line-height:1.65}
.prose>*:first-child{margin-top:0}
.prose h2{font:600 21px/1.25 var(--serif);margin:22px 0 8px}
.prose h3{font:600 17px/1.3 var(--serif);margin:18px 0 6px}
.prose h4{font-size:15px;margin:14px 0 4px}
.prose p{margin:0 0 10px;max-width:80ch}
.prose ul,.prose ol{margin:0 0 10px;padding-left:22px;max-width:78ch}
.prose li{margin:2px 0}
.prose blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--line2);color:var(--muted)}
.prose table{border-collapse:collapse;margin:10px 0;font-size:14px;display:block;overflow-x:auto;max-width:100%}
.prose th,.prose td{border:1px solid var(--line2);padding:5px 9px;text-align:left;min-width:60px}
.prose th{background:var(--surface2)}
.prose hr{border:0;border-top:1px solid var(--line2);margin:16px 0}
.prose code{font-family:var(--mono);font-size:13px;background:var(--surface2);padding:1px 4px;border-radius:3px}
.ed-area[contenteditable=true]:empty::before{content:attr(data-ph);color:var(--muted)}

/* Tagebuch */
.jcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.jhead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:6px}
.jhead .d{font:600 15px var(--serif)}
.jhead h3{font:600 17px/1.25 var(--serif);margin:0;flex:1 1 220px}
.jform{display:grid;grid-template-columns:150px 1fr 110px;gap:12px}
.jform label,.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.jform input,.jform select,.form input,.form select,.form textarea{padding:7px 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:14.5px;min-width:0}
.jform .full{grid-column:1/-1}
@media (max-width:640px){.jform{grid-template-columns:1fr 1fr}.jform .ttl{grid-column:1/-1}}
.tasklist{display:flex;flex-direction:column;gap:2px}
.trow{display:grid;grid-template-columns:28px 1fr 130px 140px 34px;gap:10px;align-items:center;padding:6px 4px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow input[type=text],.trow select,.trow input[type=date]{width:100%;padding:5px 8px;border:1px solid transparent;border-radius:4px;background:transparent;min-width:0}
.trow input[type=text]:hover,.trow select:hover,.trow input[type=date]:hover{border-color:var(--line2)}
.trow input[type=text]:focus,.trow select:focus,.trow input[type=date]:focus{border-color:var(--focus);background:var(--surface)}
.trow.done input[type=text]{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
@media (max-width:640px){.trow{grid-template-columns:28px 1fr 34px}.trow .tsel,.trow .tdate{display:none}}
.phhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:8px}
.phhead h3{margin:0;flex:1 1 240px}
.phhead .bar{flex:0 0 160px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chipbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty-state{border:1px dashed var(--line2);border-radius:10px;padding:26px;text-align:center;color:var(--muted);background:var(--surface)}
.empty-state b{display:block;color:var(--ink);font:600 17px var(--serif);margin-bottom:6px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.list-plain{margin:0;padding:0;list-style:none}
.list-plain li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.list-plain li:first-child{border-top:0}
@media (prefers-reduced-motion:no-preference){.dd{animation:dd .12s ease-out}@keyframes dd{from{opacity:0;transform:translateY(-3px)}}}

/* Bereichsseiten */
.kpis.sum{margin-bottom:22px}
.tabbar{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:8;background:var(--bg);margin:0 0 20px;padding-top:4px;border-bottom:1px solid var(--line2)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:0 0 auto;padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14.5px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
/* Lesen statt Bearbeiten: normaler Mauszeiger, Doppelklick zum Ändern */
.dbl,td.ed,.ed-area[contenteditable=false]{cursor:default}
.ed-area[contenteditable=false]{user-select:text}
.doc{border-color:var(--line)}
.doc .tb[hidden]{display:none}
.doc.editing{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.doc.editing .ed-area{cursor:text}
.docfoot{padding:0 22px 14px;font-size:12px;color:var(--muted)}
.doc.editing .docfoot{display:none}
.tb .fin{background:var(--accent);color:var(--accent-ink);font-weight:600;margin-left:6px}
.tb .fin:hover{background:var(--accent);filter:brightness(1.08)}
.rowdel{opacity:0;transition:opacity .12s}
tr:hover .rowdel,.trow:hover .rowdel,.rowdel:focus-visible,.rowdel.confirm,.confirm{opacity:1}
.trow{grid-template-columns:28px minmax(0,1fr) 120px 120px 34px}
.tname{padding:4px 2px;min-width:0}
.trow.done .tname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.tsel,.tdate{padding:2px 0}
.trow .ce{width:100%;padding:5px 8px;border:1px solid var(--focus);border-radius:4px;background:var(--surface);min-width:0}
input.ce,select.ce,textarea.ce{padding:5px 8px;border:1px solid var(--focus);border-radius:4px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.jcard.dbl:hover{border-color:var(--line2)}
@media (max-width:640px){.trow{grid-template-columns:28px minmax(0,1fr) 34px}}

[role=alert]:not(:empty){background:var(--bad-soft);color:var(--bad);padding:9px 11px;border-radius:6px;font-weight:500}
</style>
<header class="top"><div class="top-in"><a class="brand" href="#uebersicht"><b>LCT Projektmappe</b><small>Technikerarbeit · MF 70</small></a><nav class="menu" id="menu" aria-label="Bereiche"></nav><div class="msel" id="msel"><select aria-label="Seite wählen"></select></div><div class="savebox" id="savebox"></div></div></header>
<main id="main"></main>
<script type="application/json" id="lct-data">{}</script>
<script>const MODE = "web";
"use strict";
/* ===================== Grundlagen ===================== */
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
let S = null, READONLY = false;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); } for (const k of kids.flat()) { if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); } return e; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const parseD = s => s ? new Date(s + 'T12:00:00') : null;
const fmtD = s => { if (!s) return ''; const [y, m, d] = String(s).split('-'); return d ? `${d}.${m}.${y}` : s; };
const DAY = 864e5;
const nf = (v, dec = 2) => (v == null || v === '' || isNaN(v)) ? '' : Number(v).toLocaleString('de-DE', { minimumFractionDigits: dec === 'auto' ? 0 : dec, maximumFractionDigits: dec === 'auto' ? 3 : dec });
const eur = v => (v == null || v === '' || isNaN(v)) ? '' : Number(v).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
const hrs = v => (Math.round((v || 0) * 100) / 100).toLocaleString('de-DE') + ' h';
const toNum = s => { if (s == null) return null; s = String(s).trim().replace(/\s|€/g, ''); if (!s) return null; if (/,/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return isNaN(n) ? null : n; };
function toast(msg, ms = 2600) { const t = h('div', { class: 'toast', role: 'status' }, msg); document.body.append(t); setTimeout(() => t.remove(), ms); }
const DONE_ST = ['im Bestand', 'schon vorhanden', 'entfällt'];
const TONE = { 'offen': '', 'bestellt': 'warn', 'ausleihen': 'acc', 'im Bestand': 'ok', 'schon vorhanden': 'ok', 'entfällt': '', 'erledigt': 'ok', 'in Arbeit': 'acc',
  'erreicht': 'ok', 'teilweise': 'warn', 'gestrichen': '', 'ja': 'ok', 'nein': '', 'geprüft': 'ok', 'fertig': 'ok', 'Entwurf': 'acc', 'Stichpunkte': 'acc', 'überarbeitet': 'warn',
  'gering': 'ok', 'mittel': 'warn', 'hoch': 'bad', 'Muss': 'acc', 'Soll': '', 'Kann': '' };
const pill = v => h('span', { class: 'pill ' + (TONE[v] ?? '') }, v || '–');

/* ===================== Speicher ===================== */
const Store = {
  dirty: false, pending: new Map(), chains: new Map(), status: 'ok', fileHandle: null, autosave: false, t: null,
  mark(key) {
    if (READONLY) return;
    S.changedAt = new Date().toISOString();
    if (typeof Sync !== 'undefined') Sync.schedule();
    if (MODE === 'web') { Web.dirty = true; this.status = 'saving'; this.ui(); clearTimeout(this.t); this.t = setTimeout(() => Web.commit(), 2500); return; }
    if (MODE === 'stick') {
      this.dirty = true; this.ui();
      clearTimeout(this.t); this.t = setTimeout(() => { this.backup(); if (this.fileHandle && this.autosave) this.saveFile(true); }, 1500);
    } else {
      clearTimeout(this.pending.get(key)); this.status = 'saving'; this.ui();
      this.pending.set(key, setTimeout(() => { this.pending.delete(key); this.write(key); }, 900));
    }
  },
  ui() {
    const el = $('#savestate'); if (!el) return;
    let cls = '', txt = '';
    if (MODE === 'web') { cls = this.status === 'saving' ? 'dirty' : this.status === 'err' ? 'err' : ''; txt = this.status === 'saving' ? 'Speichert …' : this.status === 'err' ? 'Nicht gespeichert' : 'Alles gespeichert'; }
    else if (MODE === 'stick') { cls = this.dirty ? 'dirty' : ''; txt = this.dirty ? 'Nicht auf dem Stick gespeichert' : 'Auf dem Stick gespeichert'; if (this.dirty && this.fileHandle && this.autosave) txt = 'Speichert automatisch …'; }
    else { cls = this.status === 'saving' ? 'dirty' : this.status === 'err' ? 'err' : ''; txt = this.status === 'saving' ? 'Speichert …' : this.status === 'err' ? 'Nicht gespeichert' : (READONLY ? 'Nur Lesen' : 'Alles gespeichert'); }
    el.innerHTML = `<i class="dot ${cls}"></i><span class="lbl">${esc(txt)}</span>`; el.title = txt;
  },
  /* ---- Stick ---- */
  backup() { try { localStorage.setItem('lct-projekt-backup', JSON.stringify({ changedAt: S.changedAt, state: S })); } catch (e) { } },
  buildHtml() {
    const data = JSON.stringify(S).replace(/</g, '\\u003c');
    const A = '<!' + '--LCT-START--' + '>', Z = '<!' + '--LCT-END--' + '>';
    const endTag = '<\/script>'; let body = PRISTINE.slice(PRISTINE.indexOf(A), PRISTINE.lastIndexOf(endTag) + endTag.length) + Z;
    const o = '<scr' + 'ipt type="application/json" id="lct-data">'; const a = body.indexOf(o) + o.length, b = body.indexOf('<\/script>', a);
    body = body.slice(0, a) + data + body.slice(b);
    body = body.replace('const MODE = "online"', 'const MODE = "stick"').replace('const MODE = "web"', 'const MODE = "stick"');
    return '<!DOCTYPE html>\n<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%2374482A%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-family=%27Georgia,serif%27 font-size=%2726%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23F4EFE7%27%3ELCT%3C/text%3E%3C/svg%3E"><meta name="theme-color" content="#74482A"></head><body>' + body + '</body></html>';
  },
  async saveFile(silent) {
    if (MODE !== 'stick') return;
    S.savedAt = new Date().toISOString();
    const html = this.buildHtml();
    if (window.showSaveFilePicker) {
      try {
        if (!this.fileHandle) {
          this.fileHandle = await window.showSaveFilePicker({ suggestedName: 'LCT_Projekt.html', types: [{ description: 'Projektmappe', accept: { 'text/html': ['.html'] } }] });
        } else if ((await this.fileHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
          if (silent) return; if ((await this.fileHandle.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('perm');
        }
        const w = await this.fileHandle.createWritable(); await w.write(html); await w.close();
        this.dirty = false; this.autosave = true; this.backup(); this.ui(); if (!silent) toast('Gespeichert. Weitere Änderungen werden ab jetzt automatisch in die Datei geschrieben.');
        return;
      } catch (e) { if (e && e.name === 'AbortError') return; if (silent) return; }
    }
    const a = h('a', { href: URL.createObjectURL(new Blob([html], { type: 'text/html' })), download: 'LCT_Projekt.html' }); document.body.append(a); a.click(); a.remove();
    this.dirty = false; this.backup(); this.ui();
    toast('Neue Fassung heruntergeladen. Bitte die Datei „LCT_Projekt.html“ auf dem Stick damit ersetzen.', 6000);
  },
  /* ---- Online ---- */
  db: null,
  path(key) {
    if (key === 'settings') return ['proj', 'settings', { data: S.settings }];
    if (key === 'phases') return ['proj', 'phases', { list: S.phases }];
    if (key === 'tasks') return ['proj', 'tasks', { list: S.tasks }];
    const [kind, id] = key.split(':');
    if (kind === 'table') return ['tables', id, S.tables[id]];
    if (kind === 'doc') return ['docs', id, S.docs[id]];
    if (kind === 'journal') { const j = S.journal.find(x => x.id === id); return ['journal', id, j || null]; }
  },
  write(key) {
    const prev = this.chains.get(key) || Promise.resolve();
    const p = prev.then(() => this.writeNow(key)).then(() => { if (!this.pending.size) { this.status = 'ok'; this.ui(); } })
      .catch(e => { this.status = 'err'; this.ui(); if (e && (e.code === 'invalid_argument' || e.code === 'not_granted')) { READONLY = true; toast('Sie haben hier nur Leserechte – Änderungen werden nicht gespeichert.', 5000); } else toast('Speichern fehlgeschlagen (' + (e && e.code || 'Fehler') + '). Bitte erneut versuchen.', 5000); });
    this.chains.set(key, p); return p;
  },
  async writeNow(key) {
    const [, , data] = this.path(key); const ref = this.db.doc('vault/' + key);
    const body = data ? await Vault.enc(data) : null;
    const go = () => body ? ref.set(body) : ref.delete();
    try { await go(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); await go(); } else throw e; }
  },
  allKeys() { return ['settings', 'phases', 'tasks', ...Object.keys(S.tables).map(k => 'table:' + k), ...Object.keys(S.docs).map(k => 'doc:' + k), ...S.journal.map(j => 'journal:' + j.id)]; },
  saveAll() { if (MODE === 'stick' || MODE === 'web') { this.mark('all'); return; } this.allKeys().forEach(k => this.write(k)); }
};

/* ===================== Berechnungen ===================== */
const CALC = {
  qpr: r => (toNum(r.q) ?? 0) * (toNum(r.pr) ?? 0),
  mean: r => { const v = ['i1', 'i2', 'i3', 'i4', 'i5'].map(k => toNum(r[k])).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; },
  dev: r => { const m = CALC.mean(r); return m == null || toNum(r.soll) == null ? null : m - toNum(r.soll); },
};
const isBuffer = p => /puffer/i.test(p.n);
function phaseStats(p) {
  const ts = S.tasks.filter(t => t.ph === p.id); const done = ts.filter(t => t.st === 'erledigt').length;
  const ist = S.journal.filter(j => j.ph === p.id).reduce((a, j) => a + (toNum(j.h) || 0), 0);
  return { n: ts.length, done, ratio: ts.length ? done / ts.length : 0, ist };
}
function overall() {
  const ph = S.phases.filter(p => !isBuffer(p)); const tot = ph.reduce((a, p) => a + (toNum(p.h) || 0), 0) || 1;
  const prog = ph.reduce((a, p) => a + (toNum(p.h) || 0) * phaseStats(p).ratio, 0) / tot;
  const t = parseD(todayISO()).getTime();
  const exp = ph.reduce((a, p) => { const s = parseD(p.s)?.getTime(), e = parseD(p.e)?.getTime(); if (!s || !e) return a; const f = Math.max(0, Math.min(1, (t - s + DAY) / (e - s + DAY))); return a + (toNum(p.h) || 0) * f; }, 0) / tot;
  const hours = S.journal.reduce((a, j) => a + (toNum(j.h) || 0), 0);
  return { prog, exp, hours };
}
function costs() {
  let plan = 0, planB = 0, ist = 0;
  for (const t of Object.values(S.tables)) {
    if (t.istCol) ist += t.rows.reduce((a, r) => a + (toNum(r[t.istCol]) || 0), 0);
  }
  plan = S.tables.material ? S.tables.material.rows.reduce((a, r) => a + (r.st === 'entfällt' ? 0 : CALC.qpr(r)), 0) : 0;
  planB = S.tables.bauhaus ? S.tables.bauhaus.rows.reduce((a, r) => a + (r.st === 'entfällt' ? 0 : CALC.qpr(r)), 0) : 0;
  return { plan, planB, ist };
}
const STOCK_T = ['material', 'bauhaus', 'werkzeug', 'fehlt'];
function stock() { let tot = 0, have = 0; for (const id of STOCK_T) { const t = S.tables[id]; if (!t) continue; for (const r of t.rows) { tot++; if (DONE_ST.includes(r.st)) have++; } } return { tot, have }; }
function writing() { const t = S.tables.gliederung; if (!t) return { soll: 0, ist: 0 }; return { soll: t.rows.reduce((a, r) => a + (toNum(r.soll) || 0), 0) || toNum(S.settings.pages) || 30, ist: t.rows.reduce((a, r) => a + (toNum(r.ist) || 0), 0), fertig: t.rows.filter(r => r.st === 'fertig').length, n: t.rows.length }; }

/* ===================== Navigation ===================== */
const GROUPS = [
  { id: 'projekt', n: 'Projekt', lead: 'Worum es geht, was erreicht werden soll und welche Entscheidungen gefallen sind.', sum: sumProjekt,
    tabs: [['steckbrief', 'Steckbrief'], ['ziele', 'Ziele und Anforderungen'], ['entscheidungen', 'Entscheidungen'], ['vorgaben', 'Vorgaben der Schule'], ['notizen', 'Notizen']] },
  { id: 'planung', n: 'Planung', lead: 'Zeitplan, Arbeitspakete und die Gliederung der schriftlichen Arbeit – alles, was den Ablauf steuert.', sum: sumPlanung,
    tabs: [['zeitplan', 'Zeitplan'], ['arbeitspakete', 'Arbeitspakete'], ['gliederung', 'Gliederung der Arbeit']] },
  { id: 'technik', n: 'Technik', lead: 'Maschine, Mechanik, Auslegung, Steuerschrank, Sicherheit und Software.', sum: sumTechnik,
    tabs: [['maschine', 'Maschine MF 70'], ['aufspannplatte', 'Aufspannplatte'], ['antrieb', 'Antrieb und Auslegung'], ['steuerschrank', 'Steuerschrank'], ['sicherheit', 'Sicherheit'], ['software', 'Software und Grbl'], ['kamera', 'Grafik und Kamera']] },
  { id: 'beschaffung', n: 'Beschaffung', lead: 'Was gebraucht wird, was schon da ist, wo es herkommt und was es gekostet hat.', sum: sumBeschaffung,
    tabs: [['bestand', 'Bestand und Einkauf'], ['material', 'Materialliste'], ['bauhaus', 'Bauhaus-Liste'], ['werkzeug', 'Werkzeug und Messmittel'], ['ausgaben', 'Sonstige Ausgaben']] },
  { id: 'tagebuch', n: 'Tagebuch', lead: 'Arbeitszeiten, Fortschritte, Messwerte und Änderungen am Plan.', sum: sumTagebuch,
    tabs: [['eintraege', 'Einträge'], ['messprotokoll', 'Messprotokoll'], ['aenderungen', 'Änderungsprotokoll']] },
  { id: 'verweise', n: 'Quellen', lead: 'Quellenverzeichnis für die Arbeit und alle Links zu Dateien und Claude-Seiten.', sum: sumQuellen,
    tabs: [['quellen', 'Quellenverzeichnis'], ['links', 'Links und Dateien']] },
];
const GBY = {}, SEC = {}; GROUPS.forEach(g => { GBY[g.id] = g; g.tabs.forEach(([id, t]) => SEC[id] = { g, t }); });
const LASTTAB = {};
const PAGES = {
  steckbrief: [['doc', 'steckbrief']], entscheidungen: [['doc', 'entscheidungen']], vorgaben: [['doc', 'vorgaben']], notizen: [['doc', 'notizen']],
  ziele: [['table', 'ziele'], ['table', 'anforderungen']], gliederung: [['table', 'gliederung']],
  maschine: [['table', 'mf70']], aufspannplatte: [['doc', 'aufspannplatte']], antrieb: [['doc', 'antrieb']],
  steuerschrank: [['doc', 'steuerschrank'], ['table', 'bmk'], ['table', 'klemmen']], sicherheit: [['doc', 'sicherheit'], ['table', 'risiko']],
  software: [['doc', 'software'], ['table', 'grbl']], kamera: [['doc', 'kamera']],
  material: [['table', 'material']], bauhaus: [['table', 'bauhaus'], ['table', 'fehlt']], werkzeug: [['table', 'werkzeug']], ausgaben: [['table', 'ausgaben']],
  messprotokoll: [['table', 'messung']], aenderungen: [['table', 'aenderungen']], quellen: [['table', 'quellen']], links: [['table', 'links']],
  zeitplan: [['custom', viewSchedule]], arbeitspakete: [['custom', viewTasks]], eintraege: [['custom', viewJournal]], bestand: [['custom', viewStock]],
};
const chev = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
function buildNav() {
  const nav = $('#menu'); nav.innerHTML = '';
  nav.append(h('div', { class: 'mi' }, h('a', { class: 'mb', href: '#uebersicht', 'data-g': 'uebersicht' }, 'Übersicht')));
  for (const g of GROUPS) {
    nav.append(h('div', { class: 'mi' }, h('a', { class: 'mb', href: '#' + g.id, 'data-g': g.id, html: esc(g.n) + chev }),
      h('div', { class: 'dd', role: 'menu' }, h('a', { href: '#' + g.id, class: 'ddall' }, 'Alles zu ' + g.n), g.tabs.map(([id, t]) => h('a', { href: '#' + id, 'data-v': id, role: 'menuitem' }, t)))));
  }
  const sel = $('#msel select'); sel.innerHTML = '';
  sel.append(h('option', { value: 'uebersicht' }, 'Übersicht'));
  for (const g of GROUPS) sel.append(h('optgroup', { label: g.n }, h('option', { value: g.id }, g.n + ' – alles'), g.tabs.map(([id, t]) => h('option', { value: id }, ' ' + t))));
  sel.append(h('option', { value: 'einstellungen' }, 'Einstellungen'));
  sel.onchange = () => go(sel.value);
}
function closeMenus() { document.querySelectorAll('.mi .dd').forEach(d => { d.style.display = 'none'; requestAnimationFrame(() => d.style.display = ''); }); }
document.addEventListener('click', e => { if (e.target.closest('.dd a')) closeMenus(); });
function go(v) { if (location.hash.slice(1) === v) render(); else location.hash = v; }
window.addEventListener('hashchange', () => render());
function route() {
  const v = location.hash.slice(1);
  if (v === 'einstellungen') return { kind: 'settings' };
  if (GBY[v]) { const g = GBY[v]; return { kind: 'group', g, tab: LASTTAB[g.id] || g.tabs[0][0] }; }
  if (SEC[v]) return { kind: 'group', g: SEC[v].g, tab: v };
  if (v === 'tagebuch') return { kind: 'group', g: GBY.tagebuch, tab: 'eintraege' };
  return { kind: 'dash' };
}

/* ===================== Seiten-Rendering ===================== */
let lastRoute = '';
function render() {
  if (!S) return;
  const r = route(); const key = r.kind + (r.g ? r.g.id + r.tab : '');
  document.querySelectorAll('.mi>.mb').forEach(b => b.classList.toggle('cur', r.kind === 'group' ? b.dataset.g === r.g.id : (r.kind === 'dash' && b.dataset.g === 'uebersicht')));
  document.querySelectorAll('.dd a[data-v]').forEach(a => a.classList.toggle('cur', a.dataset.v === r.tab));
  const sel = $('#msel select'); if (sel) sel.value = r.kind === 'group' ? r.tab : r.kind === 'settings' ? 'einstellungen' : 'uebersicht';
  const keepY = key === lastRoute ? window.scrollY : 0; lastRoute = key;
  const m = $('#main'); m.innerHTML = '';
  if (window.__banner) m.append(window.__banner);
  if (READONLY) m.append(h('div', { class: 'banner' }, h('p', {}, 'Nur-Lesen-Ansicht: Sie können alles ansehen, Änderungen werden aber nicht gespeichert.')));
  if (r.kind === 'dash') { m.append(h('p', { class: 'crumb' }, 'Projektstand'), h('h1', { class: 'pt' }, 'Übersicht'), viewDashboard()); document.title = 'LCT Projektmappe'; }
  else if (r.kind === 'settings') { m.append(h('p', { class: 'crumb' }, 'Projekt'), h('h1', { class: 'pt' }, 'Einstellungen'), viewSettings()); document.title = 'Einstellungen · LCT Projektmappe'; }
  else {
    const g = r.g; LASTTAB[g.id] = r.tab;
    m.append(h('p', { class: 'crumb' }, 'Bereich'), h('h1', { class: 'pt' }, g.n), h('p', { class: 'lead' }, g.lead));
    m.append(g.sum());
    const tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': g.n });
    g.tabs.forEach(([id, t]) => tabs.append(h('a', { href: '#' + id, role: 'tab', class: 'tab' + (id === r.tab ? ' on' : ''), 'aria-selected': id === r.tab ? 'true' : 'false' }, t)));
    m.append(h('div', { class: 'tabbar' }, tabs));
    const st = h('div', { class: 'stack tabbody', role: 'tabpanel' }); m.append(st);
    const blocks = PAGES[r.tab] || [];
    const nT = blocks.filter(p => p[0] === 'table').length;
    for (const [kind, x] of blocks) {
      if (kind === 'doc') st.append(docBlock(x));
      else if (kind === 'table') st.append(tableBlock(x, nT > 1 || blocks.length > 1));
      else st.append(x());
    }
    document.title = SEC[r.tab].t + ' · ' + g.n + ' · LCT Projektmappe';
  }
  window.scrollTo(0, keepY);
}

/* ===================== Bereichs-Kennzahlen ===================== */
function sumRow(...k) { return h('div', { class: 'kpis sum' }, ...k); }
function sumProjekt() {
  const z = S.tables.ziele?.rows || [], a = S.tables.anforderungen?.rows || [];
  const muss = z.filter(r => r.p === 'Muss'); const mErr = muss.filter(r => r.st === 'erreicht').length;
  return sumRow(kpi('Muss-Ziele erreicht', `${mErr} <small>von ${muss.length}</small>`, null, muss.length ? mErr / muss.length : 0, 'ziele', true),
    kpi('Ziele in Arbeit', String(z.filter(r => r.st === 'in Arbeit').length), `${z.filter(r => r.st === 'gestrichen').length} gestrichen`, null, 'ziele'),
    kpi('Anforderungen erfüllt', `${a.filter(r => r.ok === 'ja').length} <small>von ${a.length}</small>`, null, a.length ? a.filter(r => r.ok === 'ja').length / a.length : 0, 'ziele', true),
    kpi('Entscheidungen', String(S.tables.aenderungen?.rows.length || 0), 'im Änderungsprotokoll', null, 'aenderungen'));
}
function sumPlanung() {
  const o = overall(), w = writing(); const doneT = S.tasks.filter(t => t.st === 'erledigt').length;
  const st = scheduleState(o);
  return sumRow(kpi('Gesamtfortschritt', Math.round(o.prog * 100) + ' %', st, o.prog, 'arbeitspakete'),
    kpi('Arbeitspakete', `${doneT} <small>von ${S.tasks.length}</small>`, `${S.tasks.filter(t => t.st === 'in Arbeit').length} in Arbeit`, S.tasks.length ? doneT / S.tasks.length : 0, 'arbeitspakete', true),
    kpi('Stunden', hrs(o.hours).replace(' h', '') + ` <small>von ${S.settings.hours || 160} h</small>`, null, o.hours / (toNum(S.settings.hours) || 160), 'eintraege'),
    kpi('Schriftliche Arbeit', `${nf(w.ist, 'auto')} <small>von ${nf(w.soll, 'auto')} Seiten</small>`, `${w.fertig || 0} von ${w.n || 0} Kapiteln fertig`, w.soll ? w.ist / w.soll : 0, 'gliederung'));
}
function sumTechnik() {
  const cnt = (t, f) => { const rs = S.tables[t]?.rows || []; return [rs.filter(f).length, rs.length]; };

  const m = await Store.db.doc('lock/meta').get(); const meta = m.data();
  const keep = Vault.dek; try { await Vault.unwrap(oldPw, meta); } catch (e) { Vault.dek = keep; throw new Error('Das bisherige Passwort stimmt nicht.'); }
  await Store.db.doc('lock/meta').set(await Vault.wrap(newPw));
}

function extractState(text) {
  text = text.trim();
  if (text.startsWith('{')) { const d = JSON.parse(text); return d.state && d.state.tables ? d.state : d; }
  const o = 'id="lct-data">'; const a = text.indexOf(o); if (a < 0) throw new Error('In dieser Datei wurden keine Projektdaten gefunden.');
  return JSON.parse(text.slice(a + o.length, text.indexOf('<\/script>', a)));
}

      { name: 'Tagebuch', cols: [{ l: 'Datum', w: 100 }, { l: 'Phase', w: 220 }, { l: 'Stunden', w: 80, kind: 'num' }, { l: 'Titel', w: 280 }, { l: 'Beschreibung', w: 520, kind: 'long' }], rows: S.journal.slice().sort((a, b) => (a.d || '').localeCompare(b.d || '')).map(j => [fmtD(j.d), ph[j.ph] || '', toNum(String(j.h ?? '').replace('.', ',')) ?? '', j.t || '', Out.plain(j.html)]) },
    ];
  },
  plain(html) { const d = document.createElement('div'); d.innerHTML = html || ''; d.querySelectorAll('br').forEach(b => b.replaceWith('\n')); d.querySelectorAll('p,li,h1,h2,h3,h4,tr').forEach(e => e.append('\n')); d.querySelectorAll('li').forEach(e => e.prepend('• ')); return d.textContent.replace(/\n{3,}/g, '\n\n').trim(); },
  // ---- Markdown ----
  md(html, lvl = 3) {
    const d = document.createElement('div'); d.innerHTML = html || '';
    const inl = n => [...n.childNodes].map(c => c.nodeType === 3 ? c.textContent.replace(/\s+/g, ' ') : ['B', 'STRONG'].includes(c.tagName) ? `**${inl(c).trim()}**` : ['I', 'EM'].includes(c.tagName) ? `_${inl(c).trim()}_` : c.tagName === 'BR' ? '  \n' : c.tagName === 'A' ? `[${inl(c)}](${c.getAttribute('href')})` : c.tagName === 'U' || c.tagName === 'MARK' || c.tagName === 'SPAN' ? inl(c) : inl(c)).join('');
    const blk = (n, depth = 0) => {
      const out = [];
      for (const c of n.childNodes) {
        if (c.nodeType === 3) { if (c.textContent.trim()) out.push(c.textContent.trim()); continue; }
        const t = c.tagName;
        if (/^H[1-6]$/.test(t)) out.push('#'.repeat(Math.min(6, lvl + Math.max(0, +t[1] - 2))) + ' ' + inl(c).trim());
        else if (t === 'UL' || t === 'OL') out.push([...c.children].filter(x => x.tagName === 'LI').map((li, i) => '  '.repeat(depth) + (t === 'OL' ? (i + 1) + '. ' : '- ') + inl(li).trim() + [...li.children].filter(x => x.tagName === 'UL' || x.tagName === 'OL').map(x => '\n' + blk({ childNodes: [x] }, depth + 1)).join('')).join('\n'));
        else if (t === 'TABLE') { const rows = [...c.querySelectorAll('tr')].map(tr => [...tr.children].map(td => inl(td).trim().replace(/\|/g, '/'))); if (rows.length) { const n = Math.max(...rows.map(r => r.length)); const pad = r => { while (r.length < n) r.push(''); return '| ' + r.join(' | ') + ' |'; }; out.push([pad(rows[0]), '|' + '---|'.repeat(n), ...rows.slice(1).map(pad)].join('\n')); } }
        else if (t === 'BLOCKQUOTE') out.push('> ' + inl(c).trim());
        else if (t === 'HR') out.push('---');
        else if (t === 'P' || t === 'DIV') { const s = inl(c).trim(); if (s) out.push(s); }
        else { const s = inl(c).trim(); if (s) out.push(s); }
      }
      return out.join('\n\n');
    };
    return blk(d);
  },
  mdv(c, r) { const v = Out.cellVal(c, r); if (v == null || v === '') return ''; if (Out.kind(c) === 'money') return eur(toNum(typeof v === 'number' ? String(v).replace('.', ',') : v)); if (c.t === 'calc') return nf(v, 3); if (c.t === 'date') return fmtD(v); return String(v).replace(/\|/g, '/').replace(/\s*\n\s*/g, ' '); },
  mdTable(key, skip = []) {
    const t = S.tables[key]; if (!t) return '';
    const cols = t.cols.filter(c => !skip.includes(c.k)); const L = [];
    L.push(`## ${t.title}\n`); if (t.desc) L.push(`_${t.desc}_\n`);
    if (!t.rows.length) { L.push('_(noch keine Einträge)_\n'); return L.join('\n'); }
    L.push('| ' + cols.map(c => c.l).join(' | ') + ' |', '|' + '---|'.repeat(cols.length));
    t.rows.forEach(r => L.push('| ' + cols.map(c => Out.mdv(c, r)).join(' | ') + ' |'));
    const mc = cols.filter(c => Out.kind(c) === 'money' && c.k !== 'pr'); if (mc.length) L.push('| ' + cols.map((c, i) => i === 0 ? '**Summe**' : Out.kind(c) === 'money' && c.k !== 'pr' ? '**' + eur(t.rows.reduce((a, r) => a + (toNum(typeof Out.cellVal(c, r) === 'number' ? String(Out.cellVal(c, r)).replace('.', ',') : Out.cellVal(c, r)) || 0), 0)) + '**' : '').join(' | ') + ' |');

  },
  mdDoc(id) { const d = S.docs[id]; if (!d) return ''; return `## ${d.title}\n\n${Out.md(d.html, 3)}\n`; },
  head(nr, title, purpose) { const s = S.settings; return `# ${nr} ${title}\n\n**Projekt:** ${s.title || ''}${s.school ? ' – ' + s.school : ''}  \n**Stand: ${new Date().toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' })}** – automatisch aus der LCT Projektmappe erzeugt. Zweck: ${purpose}\n\n`; },
  docsMd() {
    const s = S.settings, o = overall(); const used = new Set(); const T = k => { used.add(k); return Out.mdTable(k); }; const D = k => { used.add('doc:' + k); return Out.mdDoc(k); };
    const f = {};
    f['01_Projektueberblick.md'] = Out.head('01', 'Projektüberblick', 'Rahmen, Ziele, Anforderungen und alle Entscheidungen.') +
      `## Rahmen\n\n| Punkt | Wert |\n|---|---|\n| Projekt | ${s.title || ''} |\n| Name | ${s.name || '–'} |\n| Schule | ${s.school || ''} |\n| Start der Umsetzung | ${fmtD(s.start)} |\n| Abgabe | ${fmtD(s.end)} |\n| Präsentation | ${fmtD(s.present) || '–'} |\n| Stundenumfang | ${s.hours || ''} h |\n| Budget | ${eur(s.budget)} |\n| Seitenumfang | ca. ${s.pages || ''} Seiten |\n\n` +
      `## Aktueller Stand\n\n- Fortschritt (erledigte Arbeitspakete, nach Phasenstunden gewichtet): **${Math.round((o.prog || 0) * 100)} %**\n- Geleistete Stunden laut Tagebuch: **${hrs(o.hours)}** von ${s.hours || 160} h\n- Tagebucheinträge: ${S.journal.length}\n\n` +
      D('steckbrief') + '\n' + T('ziele') + '\n' + T('anforderungen') + '\n' + D('entscheidungen') + '\n' + T('aenderungen') + '\n' + D('vorgaben') + '\n' + D('notizen');
    const ph = S.phases; let z = Out.head('02', 'Zeitplan und Arbeitspakete', 'Phasen, Arbeitspakete mit Status und geleistete Stunden.') + '## Phasen\n\n| Nr. | Phase | Stunden Plan | Stunden Ist | Beginn | Ende | Erledigt |\n|---|---|---|---|---|---|---|\n';
    ph.forEach((p, i) => { const ts = S.tasks.filter(t => t.ph === p.id); const ist = S.journal.filter(j => j.ph === p.id).reduce((a, j) => a + (toNum(String(j.h ?? '').replace('.', ',')) || 0), 0); z += `| ${i + 1} | ${p.n} | ${p.h ?? ''} h | ${hrs(ist)} | ${fmtD(p.s)} | ${fmtD(p.e)} | ${ts.filter(t => t.st === 'erledigt').length} von ${ts.length} |\n`; });
    z += '\n## Arbeitspakete\n\n'; ph.forEach(p => { const ts = S.tasks.filter(t => t.ph === p.id); if (!ts.length) return; z += `### ${p.n}\n\n| Arbeitspaket | Status | Fällig | Bemerkung |\n|---|---|---|---|\n` + ts.map(t => `| ${t.n} | ${t.st} | ${fmtD(t.due)} | ${(t.note || '').replace(/\|/g, '/')} |`).join('\n') + '\n\n'; });
    f['02_Zeitplan_und_Arbeitspakete.md'] = z;
    f['03_Technik_und_Auslegung.md'] = Out.head('03', 'Technik und Auslegung', 'Maschine, Antrieb, Aufspannplatte, Steuerschrank, Sicherheit, Software, Kamera, Messungen.') +
      T('mf70') + '\n' + ['antrieb', 'aufspannplatte', 'steuerschrank', 'sicherheit', 'software', 'kamera'].map(D).join('\n') + '\n' + ['grbl', 'bmk', 'klemmen', 'risiko', 'messung'].map(T).join('\n');
    const sumP = k => S.tables[k] ? S.tables[k].rows.reduce((a, r) => a + (r.st === 'entfällt' ? 0 : CALC.qpr(r)), 0) : 0;
    const sumI = k => { const t = S.tables[k]; if (!t || !t.istCol) return 0; return t.rows.reduce((a, r) => a + (toNum(typeof r[t.istCol] === 'number' ? String(r[t.istCol]).replace('.', ',') : r[t.istCol]) || 0), 0); };
    const cnt = k => { const t = S.tables[k]; if (!t) return ''; const d = t.rows.filter(r => DONE_ST.includes(r.st)).length; return `${d} von ${t.rows.length} erledigt (im Bestand / schon vorhanden / entfällt)`; };
    f['04_Beschaffung_und_Bestand.md'] = Out.head('04', 'Beschaffung und Bestand', 'Was gekauft ist, was fehlt, Ist-Preise und Alternativen.') +
      `## Kurzüberblick\n\n- Materialliste: ${cnt('material')}; Richtpreis ${eur(sumP('material'))}, bisher ausgegeben ${eur(sumI('material'))}\n- Bauhaus-Liste: ${cnt('bauhaus')}; Plan ${eur(sumP('bauhaus'))}, bisher ausgegeben ${eur(sumI('bauhaus'))}\n- Werkzeug: ${cnt('werkzeug')}\n- Sonstige Ausgaben: ${eur(sumI('ausgaben'))}\n\n` +
      ['material', 'bauhaus', 'fehlt', 'werkzeug', 'ausgaben'].map(T).join('\n');
    f['05_Schriftliche_Arbeit_und_Quellen.md'] = Out.head('05', 'Schriftliche Arbeit und Quellen', 'Gliederung mit Schreibstand und Quellenverzeichnis.') + '_Die schriftliche Arbeit schreibe ich selbst. Formvorgaben: Dokument 01 (Vorgaben der Schule)._\n\n' + T('gliederung') + '\n' + T('quellen');
    let six = Out.head('06', 'Projektmappe, Links und Weiteres', 'Links, Dateien und alle weiteren Tabellen und Texte.') + `## Projektmappe\n\n- Webseite: ${location.origin + location.pathname}\n- Diese Dateien schreibt die Projektmappe automatisch in den verbundenen Stick-Ordner („LCT Aktueller Stand“).\n\n` + T('links');
    Object.keys(S.tables).filter(k => !used.has(k)).forEach(k => six += '\n' + T(k));
    Object.keys(S.docs).filter(k => !used.has('doc:' + k)).forEach(k => six += '\n' + D(k));
    f['06_Projektmappe_und_Weiteres.md'] = six;
    const phn = Object.fromEntries(S.phases.map(p => [p.id, p.n]));
    f['08_Projekttagebuch.md'] = Out.head('08', 'Projekttagebuch', 'Alle Tagebucheinträge mit Stunden.') + (S.journal.length ? `Summe: **${hrs(o.hours)}** in ${S.journal.length} Einträgen.\n\n` + S.journal.slice().sort((a, b) => (a.d || '').localeCompare(b.d || '')).map(j => `## ${fmtD(j.d)} – ${j.t || 'ohne Titel'}\n\n_Phase: ${phn[j.ph] || '–'} · ${j.h != null && j.h !== '' ? hrs(toNum(String(j.h).replace('.', ','))) : '– h'}_\n\n${Out.md(j.html, 3)}\n`).join('\n') : '_Noch keine Einträge._\n');
    return f;
  },
  files() {
    const tb = S.tables; const sheets = Object.keys(tb).map(k => Out.tableSheet(tb[k]));
    const files = [];
    const one = (name, keys) => { const ks = keys.filter(k => tb[k]); if (ks.length) files.push({ name, data: XL.book(ks.map(k => Out.tableSheet(tb[k]))) }); };
    one('Materialliste_aktuell.xlsx', ['material']);
    one('Bauhaus_Einkaufsliste_aktuell.xlsx', ['bauhaus', 'fehlt']);
    one('Werkzeug_und_Messmittel_aktuell.xlsx', ['werkzeug']);
    files.push({ name: 'Alle_Tabellen_aktuell.xlsx', data: XL.book([...Out.extraSheets(), ...sheets]) });
    const md = Out.docsMd(); for (const [n, t] of Object.entries(md)) files.push({ dir: 'Claude-Projektwissen', name: n, data: t });
    files.push({ name: 'LCT_Sicherung_aktuell.json', data: JSON.stringify(S, null, 1) });
    files.push({ name: 'LIESMICH.txt', data: 'LCT Projektmappe – Aktueller Stand\r\n\r\nDiese Dateien schreibt die Projektmappe (Webseite) automatisch, sobald Sie dort etwas ändern.\r\nBitte hier NICHTS von Hand ändern – Änderungen werden beim nächsten Speichern überschrieben.\r\nWer Dateien verändern will: auf der Webseite ändern.\r\n\r\n- *_aktuell.xlsx: die Listen mit allen Häkchen, Status und Ist-Preisen\r\n- Alle_Tabellen_aktuell.xlsx: jede Tabelle als eigenes Blatt, dazu Phasen, Arbeitspakete, Tagebuch\r\n- Claude-Projektwissen: Dokumente 01–06 und 08 für das Claude-Projekt (07 Chatverlauf bleibt unverändert)\r\n- LCT_Sicherung_aktuell.json: vollständige Sicherung (kann in der Projektmappe unter Einstellungen eingelesen werden)\r\n\r\nACHTUNG: Diese Dateien sind NICHT verschlüsselt. Stick gut aufbewahren.\r\n\r\nZuletzt geschrieben: ' + new Date().toLocaleString('de-DE') + '\r\n' });
    return files;
  },
};

const Sync = {
  dir: null, perm: 'none', last: null, err: '', t: null, busy: false, again: false, FOLDER: 'LCT Aktueller Stand',
  supported: () => typeof window.showDirectoryPicker === 'function',
  db() { return new Promise((res, rej) => { const r = indexedDB.open('lct-sync', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async idb(op, v) { const db = await this.db(); return new Promise((res, rej) => { const tx = db.transaction('h', op === 'get' ? 'readonly' : 'readwrite'); const st = tx.objectStore('h'); const q = op === 'get' ? st.get('dir') : op === 'del' ? st.delete('dir') : st.put(v, 'dir'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async init() {
    try { this.last = localStorage.getItem('lct-sync-last'); } catch (e) { }
    if (!this.supported()) return;
    try { this.dir = await this.idb('get'); } catch (e) { this.dir = null; }
    if (!this.dir) { this.perm = 'none'; this.ui(); return; }
    try { this.perm = await this.dir.queryPermission({ mode: 'readwrite' }); } catch (e) { this.perm = 'prompt'; }
    if (this.perm === 'granted') { this.schedule(500); }
    else if (!READONLY) { window.__banner = h('div', { class: 'banner' }, h('p', {}, `Stick-Ordner „${this.dir.name}“: Die Dateien auf dem Stick werden erst wieder aktualisiert, wenn Sie den Zugriff erlauben.`), h('button', { class: 'btn pri sm', id: 'sync-allow', onclick: () => this.allow() }, 'Stick-Zugriff erlauben'), h('button', { class: 'btn sm', onclick: () => { window.__banner = null; render(); } }, 'Später')); render(); }
    this.ui();
  },
  async allow() {
    try { this.perm = await this.dir.requestPermission({ mode: 'readwrite' }); } catch (e) { this.perm = 'prompt'; }
    if (this.perm === 'granted') { window.__banner = null; render(); await this.writeNow(); }
    else toast('Kein Zugriff erlaubt. Ist der Stick eingesteckt?', 5000);
    this.ui();
  },
  async connect() {
    if (!this.supported()) { toast('Das geht nur am Computer in Edge oder Chrome.', 6000); return; }
    let d; try { d = await window.showDirectoryPicker({ id: 'lct-stick', mode: 'readwrite' }); } catch (e) { if (e && e.name === 'AbortError') return; toast('Ordner konnte nicht gewählt werden: ' + (e.message || e), 6000); return; }
    this.dir = d; try { await this.idb('put', d); } catch (e) { }
    try { this.perm = await d.queryPermission({ mode: 'readwrite' }); if (this.perm !== 'granted') this.perm = await d.requestPermission({ mode: 'readwrite' }); } catch (e) { this.perm = 'prompt'; }
    window.__banner = null; this.ui();
    if (this.perm === 'granted') { await this.writeNow(); if (!this.err) toast(`Verbunden. Die Dateien liegen jetzt in „${d.name} › ${this.FOLDER}“.`, 6000); }
    render();
  },
  async disconnect() { this.dir = null; this.perm = 'none'; try { await this.idb('del'); } catch (e) { } window.__banner = null; this.ui(); render(); toast('Stick-Ordner getrennt. Die Dateien auf dem Stick bleiben erhalten.'); },
  schedule(ms = 3000) { if (!this.dir || this.perm !== 'granted') return; clearTimeout(this.t); this.state = 'wait'; this.ui(); this.t = setTimeout(() => this.writeNow(), ms); },
  async writeNow() {
    if (!this.dir || !S) return; if (this.busy) { this.again = true; return; }
    this.busy = true; this.err = ''; this.state = 'busy'; this.ui();
    try {
      if ((await this.dir.queryPermission({ mode: 'readwrite' })) !== 'granted') { this.perm = 'prompt'; throw new Error('Kein Zugriff – bitte „Stick-Zugriff erlauben“ klicken.'); }
      const root = await this.dir.getDirectoryHandle(this.FOLDER, { create: true }); const subs = {}; const failed = [];
      for (const f of Out.files()) {
        try {
          let d = root; if (f.dir) d = subs[f.dir] || (subs[f.dir] = await root.getDirectoryHandle(f.dir, { create: true }));
          const fh = await d.getFileHandle(f.name, { create: true }); const w = await fh.createWritable(); await w.write(typeof f.data === 'string' ? new Blob(['﻿' + f.data], { type: 'text/plain' }) : new Blob([f.data])); await w.close();
        } catch (e) { failed.push(f.name); }
      }
      if (failed.length) this.err = 'Nicht geschrieben (Datei vielleicht in Excel geöffnet?): ' + failed.join(', ');
      this.last = new Date().toISOString(); try { localStorage.setItem('lct-sync-last', this.last); } catch (e) { }
    } catch (e) { this.err = /NotFound|not found/i.test(String(e.name || e.message)) ? 'Stick nicht gefunden. Bitte einstecken – beim nächsten Speichern wird es erneut versucht.' : (e.message || String(e)); }
    this.busy = false; this.state = this.err ? 'err' : 'ok'; this.ui();
    if (this.again) { this.again = false; this.schedule(1500); }
  },
  downloadZip() {
    const files = Out.files().map(f => ({ name: (f.dir ? f.dir + '/' : '') + f.name, data: typeof f.data === 'string' ? new TextEncoder().encode('﻿' + f.data) : f.data }));
    const z = XL.zip(files); const a = h('a', { href: URL.createObjectURL(new Blob([z], { type: 'application/zip' })), download: 'LCT_Aktueller_Stand_' + todayISO() + '.zip' }); document.body.append(a); a.click(); a.remove();
  },
  label() {
    if (!this.supported()) return { cls: '', txt: 'Stick-Ordner: nur in Edge/Chrome am Computer' };
    if (!this.dir) return { cls: '', txt: 'Kein Stick-Ordner verbunden' };
    if (this.perm !== 'granted') return { cls: 'dirty', txt: 'Stick: Zugriff erlauben' };
    if (this.state === 'err') return { cls: 'err', txt: 'Stick: ' + this.err };
    if (this.state === 'wait' || this.state === 'busy') return { cls: 'dirty', txt: 'Stick wird aktualisiert …' };
    return { cls: '', txt: 'Stick aktuell' + (this.last ? ' (' + new Date(this.last).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ')' : '') };
  },
  ui() {
    const el = $('#syncstate'); if (el) { const l = this.label(); el.hidden = !this.dir; el.innerHTML = `<i class="dot ${l.cls}"></i>USB<span class="lbl">: ${esc((l.txt.length > 40 ? l.txt.slice(0, 38) + '…' : l.txt).replace(/^Stick:? ?/, ''))}</span>`; el.title = l.txt; }
    const p = $('#sync-panel-state'); if (p) { const l = this.label(); p.textContent = l.txt; p.style.color = l.cls === 'err' ? 'var(--bad)' : l.cls === 'dirty' ? 'var(--warn, #9a6a00)' : 'var(--ok)'; }
  },
  panel() {
    const box = h('section', { class: 'panel', id: 'sync-panel' }, h('h3', {}, 'USB-Stick-Ordner (automatische Dateien)'));
    box.append(h('p', { class: 'small muted', style: 'margin-top:0' }, 'Wenn ein Ordner verbunden ist, schreibt die Projektmappe nach jeder Änderung automatisch in den Unterordner „' + this.FOLDER + '“: die Excel-Listen (mit Häkchen, Status, Ist-Preisen), die Dokumente für das Claude-Projekt und eine Sicherung. Nur am Computer in Edge oder Chrome. Achtung: Diese Dateien sind nicht verschlüsselt.'));
    if (!this.supported()) { box.append(h('p', { class: 'small' }, 'Dieser Browser kann nicht direkt in Ordner schreiben. Sie können den aktuellen Stand aber als ZIP herunterladen.'), h('button', { class: 'btn', onclick: () => this.downloadZip() }, 'Aktuellen Stand herunterladen (ZIP)')); return box; }
    box.append(h('p', { style: 'margin:0 0 10px' }, h('b', {}, 'Status: '), h('span', { id: 'sync-panel-state' }), this.dir ? h('span', { class: 'small muted' }, ` · Ordner: ${this.dir.name} › ${this.FOLDER}`) : null));
    const row = h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' });
    if (!READONLY) {
      row.append(h('button', { class: 'btn pri', id: 'sync-connect', onclick: () => this.connect() }, this.dir ? 'Anderen Ordner wählen …' : 'Stick-Ordner verbinden …'));
      if (this.dir && this.perm !== 'granted') row.append(h('button', { class: 'btn pri', onclick: () => this.allow() }, 'Stick-Zugriff erlauben'));
      if (this.dir && this.perm === 'granted') row.append(h('button', { class: 'btn', id: 'sync-now', onclick: () => this.writeNow().then(() => toast(this.err || 'Stick aktualisiert.')) }, 'Jetzt aktualisieren'));
      if (this.dir) row.append(h('button', { class: 'btn', onclick: () => this.disconnect() }, 'Verbindung trennen'));
    }
    row.append(h('button', { class: 'btn', onclick: () => this.downloadZip() }, 'Aktuellen Stand herunterladen (ZIP)'));
    box.append(row); setTimeout(() => this.ui(), 0); return box;
  },
};

(MODE === 'stick' ? startStick : MODE === 'web' ? startWeb : startOnline)();
</script><!--LCT-END--></body></html>
